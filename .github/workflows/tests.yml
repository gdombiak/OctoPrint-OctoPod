name: Tests

on:
  pull_request:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OctoPrint 1.11.8 / Python 3.7
            python: "3.7"
            octoprint: "OctoPrint==1.11.8"
          - name: OctoPrint 2.0.0rc4 / Python 3.9
            python: "3.9"
            octoprint: "OctoPrint==2.0.0rc4"
          - name: OctoPrint 2.0.0rc4 / Python 3.13
            python: "3.13"
            octoprint: "OctoPrint==2.0.0rc4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.octoprint }}"
          python -m pip install -e ".[develop]"

      - name: Run tests
        run: python -m pytest
